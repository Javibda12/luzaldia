name: Actualizar precios y publicar

on:
  schedule:
    - cron: "7 * * * *"   # cada hora (minuto 7, hora UTC)
  workflow_dispatch:       # botón para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar la web con los precios de Red Eléctrica
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: python build.py
      - name: Guardar los precios descargados
        run: |
          git config user.name "luz-al-dia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Precios actualizados" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
