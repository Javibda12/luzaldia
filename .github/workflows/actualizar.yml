name: Actualizar precios y publicar

on:
  schedule:
    - cron: "7 * * * *"   # cada hora (minuto 7, hora UTC)
  workflow_dispatch:       # botón para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar la web con los precios de Red Eléctrica
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'https://javibda12.github.io/luzaldia' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: python build.py
      - name: Guardar los precios descargados
        run: |
          git config user.name "luz-al-dia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Precios actualizados" && git push)
      - name: Publicar en la rama gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "luz-al-dia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar web"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
